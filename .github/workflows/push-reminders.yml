# Vercel Hobby plans cap built-in crons at once-per-day, which is too coarse
# for slot reminder pushes (we want ~15 min lead time). GitHub Actions runs
# scheduled workflows down to 5-min granularity for free, so we use it as
# the trigger and let Vercel host the actual handler.
#
# Setup (already done):
# - CRON_SECRET set as a repo secret AND on Vercel project envs.
# - The /api/cron/push-reminders route validates the bearer with timing-safe
#   comparison against process.env.CRON_SECRET.
name: Push reminders cron

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron is best-effort and can drift by a
    # few minutes under load — that's fine for a 15-min lead window.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the push-reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://cms-gil.vercel.app/api/cron/push-reminders")
          echo "$response"
